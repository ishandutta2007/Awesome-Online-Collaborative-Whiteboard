<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="320">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.6" stroke-opacity="0.4"/>
      <circle cx="40" cy="40" r="1.5" fill="#64748b" fill-opacity="0.35"/>
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 19px;
        fill: #94a3b8;
      }
      .tag-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e0e7ff;
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1.5deg); }
      }
      @keyframes floatCard {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes pulseCursor {
        0%, 100% { opacity: 0.9; transform: translate(0, 0); }
        50% { opacity: 0.4; transform: translate(6px, -4px); }
      }
      @keyframes dashAnim {
        to { stroke-dashoffset: -40; }
      }
      .animated-canvas-item {
        animation: floatSlow 7s ease-in-out infinite;
      }
      .animated-sticky {
        animation: floatCard 5s ease-in-out infinite;
      }
      .animated-cursor {
        animation: pulseCursor 4s ease-in-out infinite;
      }
      .canvas-connector {
        stroke-dasharray: 6 6;
        animation: dashAnim 15s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGradient)"/>
  <rect width="1200" height="320" rx="16" fill="url(#grid)"/>

  <!-- Subtle Ambient Glows -->
  <circle cx="150" cy="60" r="140" fill="#38bdf8" fill-opacity="0.1" filter="url(#glow)"/>
  <circle cx="1050" cy="240" r="160" fill="#818cf8" fill-opacity="0.12" filter="url(#glow)"/>

  <!-- Dynamic Whiteboard Canvas Visual Elements (Positioned away from text center) -->
  <!-- Connector Path -->
  <path class="canvas-connector" d="M 820 180 C 880 120, 960 220, 1020 140" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-opacity="0.6"/>

  <!-- Sticky Note Card 1 (Brainstorming) -->
  <g class="animated-sticky" transform="translate(840, 50)">
    <rect width="140" height="105" rx="10" fill="#fef08a" fill-opacity="0.9" filter="url(#glow)"/>
    <rect x="15" y="20" width="80" height="8" rx="4" fill="#ca8a04" fill-opacity="0.6"/>
    <rect x="15" y="36" width="105" height="6" rx="3" fill="#ca8a04" fill-opacity="0.4"/>
    <rect x="15" y="50" width="95" height="6" rx="3" fill="#ca8a04" fill-opacity="0.4"/>
    <rect x="15" y="64" width="60" height="6" rx="3" fill="#ca8a04" fill-opacity="0.4"/>
    <!-- User Cursor -->
    <g class="animated-cursor" transform="translate(110, 80)">
      <path d="M0,0 L0,18 L5,14 L11,19 L14,16 L8,11 L14,11 Z" fill="#0284c7" stroke="#ffffff" stroke-width="1.5"/>
      <rect x="16" y="8" width="55" height="18" rx="4" fill="#0284c7"/>
      <text x="20" y="21" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">Alice</text>
    </g>
  </g>

  <!-- Sticky Note Card 2 (Architecture / Flow) -->
  <g class="animated-canvas-item" transform="translate(1000, 140)">
    <rect width="150" height="110" rx="10" fill="#bae6fd" fill-opacity="0.9" filter="url(#glow)">
      <!-- Drop shadow effect via glow -->
    </rect>
    <rect x="18" y="22" width="90" height="8" rx="4" fill="#0284c7" fill-opacity="0.6"/>
    <circle cx="35" cy="55" r="14" fill="#38bdf8" fill-opacity="0.4"/>
    <rect x="60" y="46" width="70" height="6" rx="3" fill="#0284c7" fill-opacity="0.4"/>
    <rect x="60" y="58" width="50" height="6" rx="3" fill="#0284c7" fill-opacity="0.4"/>
    <!-- User Cursor 2 -->
    <g class="animated-cursor" transform="translate(-15, 60)">
      <path d="M0,0 L0,18 L5,14 L11,19 L14,16 L8,11 L14,11 Z" fill="#9333ea" stroke="#ffffff" stroke-width="1.5"/>
      <rect x="16" y="8" width="45" height="18" rx="4" fill="#9333ea"/>
      <text x="20" y="21" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">Dev</text>
    </g>
  </g>

  <!-- Left Side Visual Element: Diagram Node -->
  <g class="animated-canvas-item" transform="translate(45, 90)">
    <rect width="100" height="80" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 3" fill-opacity="0.8"/>
    <circle cx="50" cy="35" r="16" fill="#38bdf8" fill-opacity="0.2"/>
    <path d="M 42 35 L 48 41 L 58 29" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="22" y="58" width="56" height="6" rx="3" fill="#64748b"/>
  </g>

  <!-- Center Content Area (Title & Subtitle in foreground, guaranteed readable) -->
  <g transform="translate(185, 95)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 0)">
      <rect width="285" height="28" rx="14" fill="url(#accentGrad)" fill-opacity="0.2" stroke="#818cf8" stroke-opacity="0.5" stroke-width="1"/>
      <circle cx="14" cy="14" r="4" fill="#38bdf8"/>
      <text x="26" y="19" class="tag-text">🎨 CURATED VISUAL ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="68" class="title-text">Collaborative Whiteboards</text>

    <!-- Subtitle -->
    <text x="0" y="104" class="subtitle-text">The ultimate guide to SaaS platforms &amp; open-source infinite canvas workspaces</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 132)">
      <!-- Pill 1 -->
      <g>
        <rect width="140" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="16" y="17" font-family="sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">⚡ Infinite Canvas</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(150, 0)">
        <rect width="155" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="16" y="17" font-family="sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">👥 Real-Time Sync</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(315, 0)">
        <rect width="160" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="16" y="17" font-family="sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">🔒 Self-Host Ready</text>
      </g>
    </g>
  </g>
</svg>
