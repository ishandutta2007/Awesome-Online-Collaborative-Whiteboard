<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="320" viewBox="0 0 1200 320"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#090d16"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".4" stroke-width=".6" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="40" r="1.5" fill="#64748b" fill-opacity=".35"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes floatSlow{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-10px) rotate(1.5deg)}}@keyframes floatCard{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes pulseCursor{0%{opacity:.9;transform:translate(0,0)}50%{opacity:.4;transform:translate(6px,-4px)}}.subtitle-text,.tag-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:46px;fill:#fff;letter-spacing:-.5px}.subtitle-text{font-weight:400;font-size:19px;fill:#94a3b8}.tag-text{font-weight:600;font-size:13px;fill:#e0e7ff}.animated-canvas-item{animation:floatSlow 7s ease-in-out infinite}.animated-sticky{animation:floatCard 5s ease-in-out infinite}.animated-cursor{animation:pulseCursor 4s ease-in-out infinite}.canvas-connector{stroke-dasharray:6 6;animation:dashAnim 15s linear infinite}</style></defs><rect width="1200" height="320" fill="url(#bgGradient)" rx="16"/><rect width="1200" height="320" fill="url(#grid)" rx="16"/><circle cx="150" cy="60" r="140